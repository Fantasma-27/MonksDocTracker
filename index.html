<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CUEA Monks Off Pitch RTP</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f0f0f0;
    --muted: #888;
    --red: #cc0000;
    --red-dark: #990000;
    --red-bg: rgba(204,0,0,0.12);
    --green: #2dce89;
    --green-bg: rgba(45,206,137,0.12);
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }

  /* Auth */
  #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; padding: 2rem; }
  .auth-logo-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .auth-logo { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--red); object-fit: cover; background: #fff; }
  .auth-club { font-size: 11px; letter-spacing: .15em; color: var(--muted); text-transform: uppercase; }
  .auth-box { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px; }
  .auth-title { font-size: 20px; font-weight: 700; color: #fff; }
  .auth-title span { color: var(--red); }
  .auth-sub { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: .04em; text-transform: uppercase; }
  .field input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 12px; color: var(--text); font-size: 14px; outline: none; transition: border-color .2s; }
  .field input:focus { border-color: var(--red); }
  .btn-primary { background: var(--red); color: #fff; border: none; border-radius: var(--radius-sm); padding: 11px 18px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s; width: 100%; }
  .btn-primary:hover { background: var(--red-dark); }
  .auth-err { font-size: 12px; color: #ff6b6b; display: none; }

  /* App */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; height: 54px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; }
  .header-logo { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--red); background: #fff; }
  .logo { font-size: 14px; font-weight: 700; flex: 1; color: #fff; }
  .logo span { color: var(--red); }
  .user-chip { font-size: 11px; color: var(--muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 99px; padding: 4px 10px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .btn-logout { background: none; border: 1px solid var(--border2); color: var(--muted); border-radius: var(--radius-sm); padding: 5px 10px; cursor: pointer; font-size: 11px; }
  .btn-logout:hover { color: var(--text); }

  main { padding: 1.5rem; max-width: 960px; margin: 0 auto; width: 100%; }

  /* Overall */
  .overall { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--red); border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
  .overall-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .overall-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .overall-pct { font-size: 13px; color: var(--red); font-weight: 600; }
  .overall-nums { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 12px; }
  .track { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
  .fill-g { background: linear-gradient(90deg, var(--red-dark), var(--red), #ff4444); }
  .fill-group { background: var(--red); }
  .fill-player { background: #666; }

  /* Groups */
  .groups { display: flex; flex-direction: column; gap: 8px; }
  .gcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .gcard:hover { border-color: var(--border2); }
  .ghead { padding: .85rem 1.1rem; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; transition: background .15s; }
  .ghead:hover { background: var(--surface2); }
  .gnum { width: 26px; height: 26px; border-radius: 5px; background: var(--red-bg); border: 1px solid rgba(204,0,0,.3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; color: var(--red); }
  .gtitle { flex: 1; font-size: 13px; font-weight: 600; color: #fff; }
  .gsub { font-size: 11px; color: var(--muted); }
  .gchev { font-size: 16px; color: var(--muted); min-width: 16px; text-align: center; }
  .gbar-wrap { padding: 0 1.1rem .7rem; }

  .members { border-top: 1px solid var(--border); padding: .9rem 1.1rem; display: none; flex-direction: column; gap: 12px; }
  .members.open { display: flex; }

  /* Member row */
  .mrow { padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .mrow:last-child { border-bottom: none; padding-bottom: 0; }
  .mhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .mname-wrap { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .mname { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mname-input { font-size: 12px; font-weight: 600; color: #fff; background: var(--surface2); border: 1px solid var(--red); border-radius: 4px; padding: 2px 6px; outline: none; width: 160px; display: none; }
  .msub { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .mactions { display: flex; gap: 4px; flex-shrink: 0; }
  .mbtn { background: none; border: 1px solid var(--border2); border-radius: 4px; color: var(--muted); cursor: pointer; font-size: 10px; padding: 3px 7px; transition: all .15s; white-space: nowrap; }
  .mbtn:hover { color: var(--text); border-color: var(--border2); }
  .mbtn.edit:hover { color: #4f8ef7; border-color: #4f8ef7; }
  .mbtn.save { color: var(--green); border-color: rgba(45,206,137,.4); display: none; }
  .mbtn.save:hover { background: var(--green-bg); }
  .mbtn.del:hover { color: var(--red); border-color: var(--red); }

  .doc-grid { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 7px; }
  .dbtn { flex: 0 0 auto; padding: 4px 7px; font-size: 10px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--muted); cursor: pointer; transition: all .15s; white-space: nowrap; font-weight: 500; }
  .dbtn.done { background: var(--green-bg); border-color: rgba(45,206,137,.3); color: var(--green); }
  .dbtn:hover:not(.done) { border-color: var(--red); color: var(--red); }

  /* Add player */
  .add-player-row { display: flex; gap: 6px; margin-top: 8px; }
  .add-player-row input { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 7px 10px; color: var(--text); font-size: 12px; outline: none; transition: border-color .2s; }
  .add-player-row input:focus { border-color: var(--red); }
  .add-player-row input::placeholder { color: var(--muted); }
  .btn-add { background: var(--red-bg); border: 1px solid rgba(204,0,0,.3); color: var(--red); border-radius: var(--radius-sm); padding: 7px 12px; font-size: 11px; font-weight: 600; cursor: pointer; transition: background .15s; white-space: nowrap; }
  .btn-add:hover { background: rgba(204,0,0,.2); }

  /* Status */
  #status-bar { position: fixed; bottom: 1rem; right: 1rem; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 8px 14px; font-size: 12px; color: var(--muted); display: none; transition: opacity .3s; z-index: 99; }

  /* Loading */
  #loading { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 16px; }
  .loading-logo { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--red); object-fit: cover; background: #fff; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .loading-text { font-size: 13px; color: var(--muted); }

  /* Confirm modal */
  #confirm-modal { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 50; padding: 1rem; }
  #confirm-modal.open { display: flex; }
  .modal-box { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }
  .modal-title { font-size: 16px; font-weight: 700; color: #fff; }
  .modal-sub { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .btn-row { display: flex; gap: 8px; }
  .btn-cancel { background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13px; cursor: pointer; flex: 1; }
  .btn-confirm-del { background: var(--red-bg); color: var(--red); border: 1px solid rgba(204,0,0,.3); border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; flex: 1; }
  .btn-confirm-del:hover { background: rgba(204,0,0,.25); }

  @media(max-width:600px){ main{padding:1rem;} header{padding:0 1rem;} }
</style>
</head>
<body>

<div id="loading">
  <img class="loading-logo" src="monks-logo.png" onerror="this.style.display='none'" alt="Monks"/>
  <div class="loading-text">Connecting…</div>
</div>

<div id="auth-screen" style="display:none">
  <div class="auth-logo-wrap">
    <img class="auth-logo" src="monks-logo.png" onerror="this.style.background='#cc0000'" alt="CUEA Monks RC"/>
    <div class="auth-club">CUEA Monks Rugby Club</div>
  </div>
  <div class="auth-box">
    <div class="auth-title">Off Pitch <span>RTP</span></div>
    <div class="auth-sub">Admin access only. Sign in to view and update document submissions.</div>
    <div class="field"><label>Email</label><input id="auth-email" type="email" placeholder="admin@example.com" autocomplete="username"/></div>
    <div class="field"><label>Password</label><input id="auth-pass" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
    <div class="auth-err" id="auth-err"></div>
    <button class="btn-primary" id="btn-signin">Sign in</button>
  </div>
</div>

<div id="app">
  <header>
    <img class="header-logo" src="monks-logo.png" onerror="this.style.display='none'" alt=""/>
    <div class="logo">CUEA Monks <span>Off Pitch RTP</span></div>
    <div class="user-chip"><div class="dot"></div><span id="user-label">—</span></div>
    <button class="btn-logout" id="btn-logout">Sign out</button>
  </header>
  <main>
    <div class="overall">
      <div class="overall-row">
        <span class="overall-label">Overall progress</span>
        <span class="overall-pct" id="total-pct">0%</span>
      </div>
      <div class="overall-nums" id="total-num">0 / 0 documents</div>
      <div class="track"><div class="fill fill-g" id="total-bar" style="width:0%"></div></div>
    </div>
    <div class="groups" id="groups-container"></div>
  </main>
</div>

<div id="confirm-modal">
  <div class="modal-box">
    <div class="modal-title">Remove player?</div>
    <div class="modal-sub" id="confirm-msg">This will permanently remove the player and all their document progress.</div>
    <div class="btn-row">
      <button class="btn-cancel" id="confirm-cancel">Cancel</button>
      <button class="btn-confirm-del" id="confirm-ok">Remove</button>
    </div>
  </div>
</div>

<div id="status-bar"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCFwXa_E7chRYrGqLql25VT1_chvUwUfek",
  authDomain: "monksdocs.firebaseapp.com",
  projectId: "monksdocs",
  storageBucket: "monksdocs.firebasestorage.app",
  messagingSenderId: "726102792209",
  appId: "1:726102792209:web:44b352954806f342deb9b0"
};
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ── Default players (imported to Firestore on first run, NOT shown in UI from here) ──
const DEFAULT_PODS = {
  1: ["John Isalambo (C)","Caleb Kiprotich","Simon Jawichre","Camille Marlyn","Gabriel Ogweno","Stephen Mankone","Kevin Komen"],
  2: ["Wambani Osundwa (C)","Jeremy Odhiambo","Meshack Opagala","Brian Nyamboki","Arnold Keya","Emmanuel Adoyo","Peter Naman"],
  3: ["Meshack Ongechi (C)","Morgan Ngumbi","Loui Ramone","Jerry Olem","John Ochido","Hopefaustin Tokali"],
  4: ["Zephenes Obwanga (C)","Wyclife Ayieko","Patrick Vieri","Livingstone O.","Joshua Ongeri","Reagan Morgan","Eugene Odhiambo"],
  5: ["Burungo Nyanja (C)","Noah Otieno","Timothy Ochieng","Ezekiel Apida","Teddy Owino","Jakinda Roy","Shem Kisiara"],
  6: ["Felix Okumu (C)","Kwame Walgwe","Isaac Kubasu","Feishal Ochieng","Elly Okomo","Malova Graham"],
  7: ["Kevin Mburu (C)","Delton Mwinami","Philip Walukana","Kevin Mbogo","Eliud Ondieki","Max Barasa","Ephy King'uku"],
  8: ["Isaac Maundu (C)","Peter Ondicho","Nyongesa Wekesa","Elias Owino","Samuel Owino","Duke Monda","Denzel Kipkorir"],
  9: ["Joseph Omondi (C)","Terry Okumu","Ian Bakari","Alvin Ogutu","Dennis Mulinge","Tim Trevor"],
  10: ["Michael Owen (C)","Cornish Mose","Davian Nabiswa","Wayne Rooney","Jonathan Bravo","Amos Omariba"],
  11: ["Felix Omondi (C)","Alvin Otieno","Elly Ojwang","Harlequin Abraham","Victor Rheins","Victor Omupere"]
};

const DOCS = [
  "Passport Photo","National ID/BC","Player Profile","Code of Conduct",
  "Rugby Ready","Laws of Game","First Aid","Concussion Mgmt","Keep Rugby Clean"
];
const DOCS_PER = DOCS.length;
const NUM_PODS = 11;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);

// localData: { state: {}, pods: { 1: [{id,name}, ...], ... } }
let localData = { state: {}, pods: {} };
let unsubscribe = null;

function pct(a,b){ return b===0?0:Math.round(a/b*100); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function showStatus(msg,ms=1800){
  const b=document.getElementById('status-bar');
  b.textContent=msg; b.style.display='block'; b.style.opacity='1';
  setTimeout(()=>{ b.style.opacity='0'; setTimeout(()=>b.style.display='none',300); },ms);
}

// ── Auth ──
document.getElementById('btn-signin').addEventListener('click', async()=>{
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  const err=document.getElementById('auth-err');
  err.style.display='none';
  try{ await signInWithEmailAndPassword(auth,email,pass); }
  catch(e){ err.textContent='Incorrect email or password.'; err.style.display='block'; }
});
document.getElementById('btn-logout').addEventListener('click',()=>signOut(auth));
document.getElementById('auth-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('btn-signin').click(); });

onAuthStateChanged(auth, user=>{
  document.getElementById('loading').style.display='none';
  if(user){
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('user-label').textContent=user.email;
    startListening();
  } else {
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('app').style.display='none';
    if(unsubscribe){ unsubscribe(); unsubscribe=null; }
  }
});

// ── Firestore ──
function startListening(){
  const ref = doc(db,'tracker','main');
  unsubscribe = onSnapshot(ref, snap=>{
    if(!snap.exists()){
      // First run: seed player data into Firestore
      const pods = {};
      for(let g=1;g<=NUM_PODS;g++){
        pods[g] = DEFAULT_PODS[g].map(name=>({ id: uid(), name }));
      }
      localData = { state:{}, pods };
      saveAll().then(()=>{ renderUI(); showStatus('Player data initialised ✓'); });
    } else {
      const d = snap.data();
      localData.state = d.state || {};
      localData.pods  = d.pods  || {};
      renderUI();
    }
  });
}

async function saveAll(){
  await setDoc(doc(db,'tracker','main'),{
    state: localData.state,
    pods:  localData.pods,
    updatedAt: serverTimestamp()
  },{ merge: true });
}

// ── Toggle doc ──
async function toggleDoc(g, playerId, d){
  const k = `${g}_${playerId}`;
  if(!localData.state[k]) localData.state[k] = new Array(DOCS_PER).fill(false);
  localData.state[k][d] = !localData.state[k][d];
  const val = localData.state[k][d];
  const btn = document.getElementById(`btn-${g}-${playerId}-${d}`);
  if(btn) btn.classList.toggle('done', val);
  updateMemberBar(g, playerId);
  updateGroupBar(g);
  updateTotalBar();
  try{ await saveAll(); showStatus(val?'✓ Saved':'Unmarked'); }
  catch(e){ localData.state[k][d]=!val; showStatus('⚠ Save failed',3000); }
}

// ── Add player ──
async function addPlayer(g){
  const input = document.getElementById(`add-input-${g}`);
  const name = input.value.trim();
  if(!name) return;
  const player = { id: uid(), name };
  if(!localData.pods[g]) localData.pods[g]=[];
  localData.pods[g].push(player);
  input.value='';
  appendMemberRow(g, player);
  updateGroupBar(g);
  updateTotalBar();
  try{ await saveAll(); showStatus(`${name} added ✓`); }
  catch(e){ localData.pods[g].pop(); showStatus('⚠ Save failed',3000); }
}

// ── Rename player ──
async function saveRename(g, playerId){
  const input = document.getElementById(`rename-${g}-${playerId}`);
  const newName = input.value.trim();
  if(!newName) return;
  const player = localData.pods[g].find(p=>p.id===playerId);
  const oldName = player.name;
  player.name = newName;
  document.getElementById(`mname-${g}-${playerId}`).textContent = newName;
  toggleEditMode(g, playerId, false);
  try{ await saveAll(); showStatus('Name updated ✓'); }
  catch(e){ player.name=oldName; document.getElementById(`mname-${g}-${playerId}`).textContent=oldName; showStatus('⚠ Save failed',3000); }
}

function toggleEditMode(g, playerId, on){
  document.getElementById(`mname-${g}-${playerId}`).style.display = on?'none':'block';
  document.getElementById(`rename-${g}-${playerId}`).style.display = on?'inline-block':'none';
  document.getElementById(`editbtn-${g}-${playerId}`).style.display = on?'none':'inline-block';
  document.getElementById(`savebtn-${g}-${playerId}`).style.display = on?'inline-block':'none';
  if(on){
    const inp = document.getElementById(`rename-${g}-${playerId}`);
    inp.value = localData.pods[g].find(p=>p.id===playerId).name;
    inp.focus();
  }
}

// ── Remove player ──
let pendingRemove = null;
function confirmRemove(g, playerId, name){
  document.getElementById('confirm-msg').textContent = `This will permanently remove ${name} and all their document progress from Pod ${g}.`;
  pendingRemove = { g, playerId };
  document.getElementById('confirm-modal').classList.add('open');
}
document.getElementById('confirm-cancel').addEventListener('click',()=>{
  document.getElementById('confirm-modal').classList.remove('open');
  pendingRemove=null;
});
document.getElementById('confirm-ok').addEventListener('click', async()=>{
  if(!pendingRemove) return;
  const {g, playerId} = pendingRemove;
  document.getElementById('confirm-modal').classList.remove('open');
  const idx = localData.pods[g].findIndex(p=>p.id===playerId);
  const removed = localData.pods[g].splice(idx,1)[0];
  delete localData.state[`${g}_${playerId}`];
  document.getElementById(`mrow-${g}-${playerId}`)?.remove();
  updateGroupBar(g);
  updateTotalBar();
  try{ await saveAll(); showStatus(`${removed.name} removed`); }
  catch(e){ showStatus('⚠ Save failed',3000); }
  pendingRemove=null;
});

// ── Render ──
function renderUI(){
  updateTotalBar();
  const cont = document.getElementById('groups-container');
  if(cont.children.length===0) buildGroupCards();
  else { refreshAllBars(); refreshAllButtons(); }
}

function buildGroupCards(){
  const cont = document.getElementById('groups-container');
  cont.innerHTML='';
  for(let g=1;g<=NUM_PODS;g++){
    const players = localData.pods[g] || [];
    const card = document.createElement('div'); card.className='gcard';
    const head = document.createElement('div'); head.className='ghead';
    head.innerHTML=`<div class="gnum">${g}</div><div style="flex:1"><div class="gtitle">Pod ${g}</div><div class="gsub" id="gsub-${g}">0/${players.length*DOCS_PER} docs · 0%</div></div><span class="gchev" id="gchev-${g}">›</span>`;
    const barWrap = document.createElement('div'); barWrap.className='gbar-wrap';
    barWrap.innerHTML=`<div class="track"><div class="fill fill-group" id="gbar-${g}" style="width:0%"></div></div>`;
    const mem = document.createElement('div'); mem.className='members'; mem.id=`mem-${g}`;

    players.forEach(player=> appendMemberRow(g, player, mem));

    // Add player row
    const addRow = document.createElement('div'); addRow.className='add-player-row';
    addRow.innerHTML=`<input id="add-input-${g}" placeholder="Add player name…"/><button class="btn-add" onclick="window._addPlayer(${g})">+ Add</button>`;
    mem.appendChild(addRow);
    document.addEventListener('keydown', e=>{
      const inp = document.getElementById(`add-input-${g}`);
      if(e.key==='Enter' && document.activeElement===inp) window._addPlayer(g);
    });

    head.addEventListener('click',()=>{
      const open=mem.classList.toggle('open');
      document.getElementById(`gchev-${g}`).textContent=open?'˅':'›';
    });
    card.appendChild(head); card.appendChild(barWrap); card.appendChild(mem);
    cont.appendChild(card);
  }
  refreshAllBars(); refreshAllButtons();
}

function appendMemberRow(g, player, container){
  const mem = container || document.getElementById(`mem-${g}`);
  const addRow = mem.querySelector('.add-player-row');
  const mrow = document.createElement('div');
  mrow.className='mrow'; mrow.id=`mrow-${g}-${player.id}`;
  let btns='<div class="doc-grid">';
  DOCS.forEach((dname,d)=>{ btns+=`<button class="dbtn" id="btn-${g}-${player.id}-${d}" onclick="window._toggle(${g},'${player.id}',${d})" title="${dname}">${dname}</button>`; });
  btns+='</div>';
  mrow.innerHTML=`
    <div class="mhead">
      <div class="mname-wrap">
        <span class="mname" id="mname-${g}-${player.id}">${player.name}</span>
        <input class="mname-input" id="rename-${g}-${player.id}" onkeydown="if(event.key==='Enter')window._saveRename(${g},'${player.id}')"/>
      </div>
      <span class="msub" id="msub-${g}-${player.id}">0/${DOCS_PER}</span>
      <div class="mactions">
        <button class="mbtn edit" id="editbtn-${g}-${player.id}" onclick="window._toggleEdit(${g},'${player.id}',true)">✏ Rename</button>
        <button class="mbtn save" id="savebtn-${g}-${player.id}" onclick="window._saveRename(${g},'${player.id}')">✓ Save</button>
        <button class="mbtn del" onclick="window._confirmRemove(${g},'${player.id}','${player.name.replace(/'/g,"\\'")}')">✕ Remove</button>
      </div>
    </div>
    ${btns}
    <div class="track" style="margin-top:5px"><div class="fill fill-player" id="mbar-${g}-${player.id}" style="width:0%"></div></div>
  `;
  if(addRow) mem.insertBefore(mrow, addRow);
  else mem.appendChild(mrow);
  // Restore doc state
  const arr = localData.state[`${g}_${player.id}`] || [];
  DOCS.forEach((_,d)=>{ const btn=document.getElementById(`btn-${g}-${player.id}-${d}`); if(btn) btn.classList.toggle('done',!!arr[d]); });
  updateMemberBar(g, player.id);
}

// ── Bar updates ──
function playerDone(g, playerId){ return (localData.state[`${g}_${playerId}`]||[]).filter(Boolean).length; }
function groupDone(g){ return (localData.pods[g]||[]).reduce((t,p)=>t+playerDone(g,p.id),0); }
function totalDone(){ let t=0; for(let g=1;g<=NUM_PODS;g++) t+=groupDone(g); return t; }
function totalPlayers(){ let t=0; for(let g=1;g<=NUM_PODS;g++) t+=(localData.pods[g]||[]).length; return t; }
function totalMax(){ return totalPlayers()*DOCS_PER; }

function updateMemberBar(g,playerId){
  const done=playerDone(g,playerId), max=DOCS_PER;
  const el=document.getElementById(`mbar-${g}-${playerId}`); if(el) el.style.width=pct(done,max)+'%';
  const sub=document.getElementById(`msub-${g}-${playerId}`); if(sub) sub.textContent=`${done}/${max}`;
}
function updateGroupBar(g){
  const players=localData.pods[g]||[], max=players.length*DOCS_PER, done=groupDone(g);
  const el=document.getElementById(`gbar-${g}`); if(el) el.style.width=pct(done,max)+'%';
  const sub=document.getElementById(`gsub-${g}`); if(sub) sub.textContent=`${done}/${max} docs · ${pct(done,max)}%`;
}
function updateTotalBar(){
  const done=totalDone(), max=totalMax(), players=totalPlayers();
  document.getElementById('total-bar').style.width=pct(done,max)+'%';
  document.getElementById('total-pct').textContent=pct(done,max)+'%';
  document.getElementById('total-num').textContent=`${done} / ${max} documents · ${players} players`;
}
function refreshAllBars(){ for(let g=1;g<=NUM_PODS;g++){ updateGroupBar(g); (localData.pods[g]||[]).forEach(p=>updateMemberBar(g,p.id)); } updateTotalBar(); }
function refreshAllButtons(){
  for(let g=1;g<=NUM_PODS;g++) (localData.pods[g]||[]).forEach(p=>{
    const arr=localData.state[`${g}_${p.id}`]||[];
    DOCS.forEach((_,d)=>{ const btn=document.getElementById(`btn-${g}-${p.id}-${d}`); if(btn) btn.classList.toggle('done',!!arr[d]); });
    updateMemberBar(g,p.id);
  });
}

// ── Globals ──
window._toggle        = toggleDoc;
window._addPlayer     = addPlayer;
window._saveRename    = saveRename;
window._toggleEdit    = toggleEditMode;
window._confirmRemove = confirmRemove;
</script>
